
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catalogue des produits</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">

    <style>
        body {
            background-color: #f5f5f7;
        }

        .navbar {
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.08);
        }

        .page-title {
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        .card-catalogue {
            border: none;
            border-radius: 0.9rem;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
        }

        .table {
            margin-bottom: 0;
        }

        .table thead.table-dark th {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .table tbody td {
            vertical-align: middle;
            font-size: 0.95rem;
        }

        .btn-primary.btn-sm {
            border-radius: 999px;
            padding-inline: 1.25rem;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-light bg-white mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Gestion des ventes</span>
    </div>
</nav>

<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-lg-10">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h4 page-title mb-0">Catalogue des produits</h1>
            </div>

            <div class="card card-catalogue">
                <div class="card-body p-0">

                    <!-- === TON TABLEAU D’ORIGINE (structure inchangée) === -->
                    <table class="table table-bordered table-striped mb-0">
                        <thead class="table-dark">
                        <tr>
                            <th>Code produit</th>
                            <th>Nom produit</th>
                            <th>Prix produit (DH)</th>
                            <th>Quantité existante</th>
                            <th>Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${produits}">
                            <td th:text="${p.codeProduit}"></td>
                            <td th:text="${p.nomProduit}"></td>
                            <td th:text="${p.prixProduit}"></td>
                            <td th:text="${p.quantiteExistante}"></td>
                            <td>
                                <a th:href="@{'/commande/nouvelle/' + ${p.codeProduit}}"
                                   class="btn btn-primary btn-sm">
                                   Commander
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <!-- ================================================ -->

                </div>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS (optionnel) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
