
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Commande validée</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .success-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .card-success {
            border: none;
            border-radius: 1.25rem;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
            overflow: hidden;
        }

        .card-success-header {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: #fff;
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .success-icon {
            width: 46px;
            height: 46px;
            border-radius: 999px;
            border: 2px solid rgba(255,255,255,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            background: rgba(255,255,255,0.12);
        }

        .card-success-body {
            padding: 1.75rem 2rem 1.5rem 2rem;
        }

        .order-info {
            background: #f9fafb;
            border-radius: 0.75rem;
            padding: 1.25rem 1.5rem;
            border: 1px solid #e5e7eb;
        }

        .order-label {
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #6b7280;
            margin-bottom: 0.15rem;
        }

        .order-value {
            font-weight: 600;
            color: #111827;
            font-size: 1rem;
        }

        .badge-status {
            font-size: 0.78rem;
            border-radius: 999px;
            padding: 0.35rem 0.75rem;
        }

        .card-success-footer {
            padding: 1.25rem 2rem 1.75rem 2rem;
            border-top: 1px solid #e5e7eb;
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="success-container">
    <div class="card card-success w-100" style="max-width: 720px;">
        <!-- HEADER -->
        <div class="card-success-header">
            <div class="success-icon">
                ✓
            </div>
            <div>
                <h3 class="mb-0 fw-semibold">Commande validée</h3>
                <p class="mb-0 small opacity-75">
                    Votre commande a été enregistrée avec succès.
                </p>
            </div>
            <span class="ms-auto badge bg-light text-success badge-status">
                Simulation
            </span>
        </div>

        <!-- BODY -->
        <div class="card-success-body">
            <div class="order-info mb-3">
                <div class="row g-3 align-items-center">
                    <div class="col-md-6">
                        <div class="order-label">Code produit</div>
                        <div class="order-value" th:text="${codeProduit}">P001</div>
                    </div>
                    <div class="col-md-3">
                        <div class="order-label">Quantité</div>
                        <div class="order-value" th:text="${quantite}">1</div>
                    </div>
                    <div class="col-md-3 text-md-end">
                        <div class="order-label">Statut</div>
                        <div class="order-value text-success">Confirmée</div>
                    </div>
                </div>
            </div>

            <p class="mb-0 text-muted small">
                Vous pouvez revenir au catalogue pour passer une nouvelle commande
                ou télécharger la facture PDF générée automatiquement.
            </p>
        </div>

        <!-- FOOTER -->
        <div class="card-success-footer">
            <div class="d-flex gap-2">
                <a th:href="@{/produits}" class="btn btn-outline-secondary">
                    ← Retour au catalogue
                </a>
            </div>

            <a th:href="@{'/commande/facture/' + ${codeProduit} + '/' + ${quantite}}"
               class="btn btn-success">
                Télécharger la facture PDF
            </a>
        </div>
    </div>
</div>

<!-- Bootstrap JS (optionnel) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
