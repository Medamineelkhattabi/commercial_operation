
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Passer une commande</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4">Passer une commande</h2>

    <div class="card shadow-sm">
        <div class="card-body">

            <form th:action="@{/commande/valider}" method="post">

                <!-- Code produit caché -->
                <input type="hidden" name="codeProduit" th:value="${produit.codeProduit}"/>

                <div class="mb-3">
                    <label class="form-label">Code produit</label>
                    <input type="text" class="form-control"
                           th:value="${produit.codeProduit}" disabled>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nom produit</label>
                    <input type="text" class="form-control"
                           th:value="${produit.nomProduit}" disabled>
                </div>

                <div class="mb-3">
                    <label class="form-label">Prix unitaire (DH)</label>
                    <input type="text" class="form-control"
                           th:value="${produit.prixProduit}" disabled>
                </div>

                <div class="mb-3">
                    <label class="form-label">Quantité à commander</label>
                    <input type="number" class="form-control"
                           name="quantite" min="1" th:value="${quantite}">
                </div>

                <button class="btn btn-success">Valider la commande</button>
                <a href="/produits" class="btn btn-secondary ms-2">Retour</a>
            </form>

        </div>
    </div>

</div>

</body>
</html>
